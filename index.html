<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHUAAAX | Spider</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(9, 15, 28, 0.72);
      --panel-2: rgba(16, 22, 38, 0.85);
      --red: #e11b21;
      --red-soft: #ff4a52;
      --blue: #0d203d;
      --text: #f5f7ff;
      --muted: #c6d1ec;
      --line: rgba(255,255,255,0.18);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    body {
      position: relative;
      min-height: 100vh;
      perspective: 1200px;
    }

    .video-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #000;
    }

    .video-bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.34;
      filter: brightness(0.65) contrast(1.15) saturate(1.1);
    }

    .video-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(4,7,12,0.88), rgba(5,10,24,0.58), rgba(24,6,10,0.7));
    }

    .container {
      position: relative;
      z-index: 1;
      width: min(1120px, 90vw);
      margin: 0 auto;
      padding: 26px 0 70px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 16px 22px;
      background: rgba(8, 12, 20, 0.52);
      border: 1px solid var(--line);
      border-radius: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 16px 35px rgba(0,0,0,0.25);
      transform: translateZ(40px);
    }

    .brand {
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: white;
      text-shadow: 2px 2px 0 var(--red), 0 0 18px rgba(255,75,75,0.5);
      transform: rotateX(12deg);
    }

    .nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .nav a {
      color: var(--muted);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.78rem;
      transition: transform 0.25s ease, color 0.25s ease;
    }

    .nav a:hover {
      color: white;
      transform: translateY(-2px) translateZ(18px);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 34px;
      min-height: 72vh;
      padding-top: 30px;
    }

    .tag {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 0.72rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(4rem, 10vw, 8.5rem);
      line-height: 0.8;
      letter-spacing: -5px;
      text-transform: uppercase;
      text-shadow: 4px 4px 0 var(--red), 0 0 30px rgba(255,75,75,0.35);
      transform: rotateX(8deg) rotateY(-8deg);
      transition: transform 0.2s ease;
    }

    .intro {
      max-width: 600px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 1.08rem;
      text-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 170px;
      padding: 14px 22px;
      border-radius: 12px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 12px 24px rgba(0,0,0,0.25);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .button:hover {
      transform: translateY(-4px) translateZ(18px);
      box-shadow: 0 18px 28px rgba(0,0,0,0.35);
    }

    .primary {
      background: linear-gradient(135deg, var(--red), var(--red-soft));
      color: white;
    }

    .secondary {
      background: rgba(255,255,255,0.04);
      color: white;
    }

    .profile-card {
      position: relative;
      background: linear-gradient(150deg, rgba(17, 24, 38, 0.88), rgba(7, 10, 18, 0.9));
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 26px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.38), 0 0 30px rgba(255, 70, 70, 0.08);
      transform-style: preserve-3d;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .profile-card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.08);
      pointer-events: none;
      transform: translateZ(18px);
    }

    .profile-card:hover {
      transform: rotateX(4deg) rotateY(-6deg) translateY(-4px);
      box-shadow: 0 26px 50px rgba(0,0,0,0.42), 0 0 35px rgba(255, 70, 70, 0.12);
    }

    .portrait {
      height: 320px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.18);
      background:
        linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.55)),
        url('https://images.unsplash.com/photo-1531259683007-016a7b628fc3?auto=format&fit=crop&w=900&q=85') center / cover no-repeat;
      transform: translateZ(26px);
      box-shadow: 0 18px 30px rgba(0,0,0,0.3);
    }

    .profile-card h2 {
      margin: 18px 0 6px;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      transform: translateZ(24px);
    }

    .profile-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      transform: translateZ(22px);
    }

    .section {
      margin-top: 40px;
    }

    .section h3 {
      margin: 0 0 18px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 1.3rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 14px;
      perspective: 1100px;
    }

    .crater {
      position: relative;
      background: rgba(7, 12, 20, 0.76);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 18px 14px;
      min-height: 150px;
      color: white;
      text-align: left;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 10px 18px rgba(0,0,0,0.2);
    }

    .crater:hover {
      transform: rotateX(8deg) rotateY(-8deg) translateY(-5px) translateZ(18px);
      border-color: rgba(255, 95, 95, 0.8);
      box-shadow: 0 18px 28px rgba(0,0,0,0.3), 0 0 20px rgba(255, 88, 88, 0.08);
    }

    .crater b {
      display: block;
      margin-bottom: 10px;
      color: var(--red-soft);
      font-size: 0.94rem;
      letter-spacing: 1px;
      transform: translateZ(14px);
    }

    .crater span {
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.9rem;
      transform: translateZ(12px);
      display: block;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(0,0,0,0.72);
      z-index: 10;
      padding: 20px;
    }

    .modal.show {
      display: grid;
    }

    .modal-box {
      width: min(440px, 100%);
      background: linear-gradient(180deg, rgba(19,25,36,0.96), rgba(7,10,18,0.98));
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 20px 18px;
      transform: rotateX(10deg) translateY(0px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .modal-head h4 {
      margin: 0;
      font-size: 1.4rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .close {
      border: 0;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-box p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }
      .grid {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }
    }

    @media (max-width: 560px) {
      .topbar {
        flex-direction: column;
      }
      .nav {
        justify-content: center;
      }
      .actions {
        flex-direction: column;
      }
      .button {
        width: 100%;
      }
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="video-bg">
    <video autoplay muted loop playsinline>
      <source src="https://v1.pinimg.com/videos/iht/expMp4/ad/8d/28/ad8d28a92d908fe9d76d8ba0b742dd40_720w.mp4" type="video/mp4" />
    </video>
  </div>

  <div class="container">
    <header class="topbar">
      <div class="brand">SHUAAAX</div>
      <nav class="nav">
        <a href="#">Home</a>
        <a href="#">Crater</a>
        <a href="https://www.instagram.com/shuaaaaaib/?hl=en" target="_blank" rel="noopener">Instagram</a>
        <a href="https://www.youtube.com/@shuaxmods133" target="_blank" rel="noopener">YouTube</a>
      </nav>
    </header>

    <main class="hero">
      <section>
        <div class="tag">Spider inspired</div>
        <h1>Spider<br>Man</h1>
        <p class="intro">
          SHUAAAX creator page with a fixed cinematic city background, red-blue energy,
          and a minimal landing layout with 3D depth styling.
        </p>
        <div class="actions">
          <a class="button primary" href="https://www.instagram.com/shuaaaaaib/?hl=en" target="_blank" rel="noopener">Instagram</a>
          <a class="button secondary" href="https://www.youtube.com/@shuaxmods133" target="_blank" rel="noopener">YouTube</a>
        </div>
      </section>

      <aside class="profile-card">
        <div class="portrait"></div>
        <h2>SHUAAAX</h2>
        <p>Creator • Motion • Digital identity</p>
      </aside>
    </main>

    <section class="section">
      <h3>Crater Details</h3>
      <div class="grid">
        <button class="crater" data-title="Crater 01" data-text="Main identity zone with red energy and hero-driven design."><b>Crater 01</b><span>Main identity zone</span></button>
        <button class="crater" data-title="Crater 02" data-text="Night-city energy with a calm but powerful look."><b>Crater 02</b><span>Night city zone</span></button>
        <button class="crater" data-title="Crater 03" data-text="A motion-driven layer built for creators and creative platforms."><b>Crater 03</b><span>Motion layer</span></button>
        <button class="crater" data-title="Crater 04" data-text="Final creator layer for SHUAAAX fans and subscribers."><b>Crater 04</b><span>Creator layer</span></button>
      </div>
    </section>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-head">
        <h4 id="modalTitle">Title</h4>
        <button class="close" id="closeBtn" aria-label="Close">×</button>
      </div>
      <p id="modalText">Details</p>
    </div>
  </div>

  <script>
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const closeBtn = document.getElementById('closeBtn');

    document.querySelectorAll('.crater').forEach((btn) => {
      btn.addEventListener('click', () => {
        modalTitle.textContent = btn.dataset.title;
        modalText.textContent = btn.dataset.text;
        modal.classList.add('show');
      });
    });

    closeBtn.addEventListener('click', () => modal.classList.remove('show'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('show');
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') modal.classList.remove('show');
    });

    const heroTitle = document.querySelector('h1');
    const profileCard = document.querySelector('.profile-card');
    const craterButtons = document.querySelectorAll('.crater');

    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 18;
      const y = (e.clientY / window.innerHeight - 0.5) * 18;

      heroTitle.style.transform = `rotateX(${(-y).toFixed(2)}deg) rotateY(${(x).toFixed(2)}deg)`;
      profileCard.style.transform = `rotateX(${(-y / 2).toFixed(2)}deg) rotateY(${(x / 1.8).toFixed(2)}deg) translateY(-4px)`;

      craterButtons.forEach((button, index) => {
        const depth = index % 2 === 0 ? 1 : -1;
        button.style.transform = `rotateX(${(-y / 2.6).toFixed(2)}deg) rotateY(${(x / 2.5 * depth).toFixed(2)}deg) translateY(-3px)`;
      });
    });
  </script>
</body>
</html>
